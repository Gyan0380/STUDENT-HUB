<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StudentHub — Chat & community for students</title>
  <meta name="description" content="StudentHub: real-time class chats, global and anonymous rooms, profiles, notifications and admin tools for students." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="google-site-verification" content="_yUAEk_wRj_Wa-xwiR5WyWZQ6gDfSpSKla4DUtADZSs" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply saved theme before first paint, so there's no light-mode flash for dark-mode users.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('studentchat-theme') || 'light');
  </script>
</head>
<body>
  <div class="app" id="app">
    <!-- Everything is rendered here by app.js based on the URL hash -->
    <div class="boot">Loading StudentHub… 🚀</div>
  </div>

  <!-- Firebase (CDN, ES module — no npm install / no build step needed) -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
